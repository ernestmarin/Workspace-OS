name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild native modules for Node
        env:
          npm_config_nodedir: /usr/local
        run: npm run rebuild:node

      - name: Typecheck main, preload and shared code
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.node.json

      - name: Typecheck renderer
        run: ./node_modules/.bin/tsc --noEmit -p src/renderer/tsconfig.json

      - name: Check typecheck baseline
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate macro registry
        run: npm run check:macros

      - name: Unit tests
        run: ./node_modules/.bin/vitest run --config config/vitest.config.ts --maxWorkers=2

      - name: Build
        run: npm run build
