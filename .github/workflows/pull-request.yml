name: Pull request checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rebuild native modules for Node
        env:
          npm_config_nodedir: /usr/local
        run: npm run rebuild:node

      - name: Typecheck main, preload and shared code
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.node.json

      - name: Typecheck renderer
        run: ./node_modules/.bin/tsc --noEmit -p src/renderer/tsconfig.json

      - name: Check typecheck baseline
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: ./node_modules/.bin/vitest run --config config/vitest.config.ts --maxWorkers=2
